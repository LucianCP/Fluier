<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1a14">
<title>Fluier – Legile Jocului</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1a14; --panel:#15251c; --panel2:#1b2f24; --line:#2a4234;
    --text:#eef4ef; --muted:#9db3a5; --accent:#3ddc84; --accent-ink:#06210f;
    --yellow:#f5c518; --ok:#22c55e; --bad:#ef4444; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:14px 16px 80px}
  header{display:flex;align-items:center;gap:12px;padding:6px 0 10px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em;cursor:pointer}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
  .brand small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
  .spacer{flex:1}
  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
  nav.tabs button{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 14px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
  nav.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .user{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3}
  .user a{color:var(--accent);cursor:pointer}
  h1{font-size:25px;letter-spacing:-.03em;margin:4px 0}
  h2{font-size:18px;margin:22px 0 10px}
  h3{margin:0 0 4px;font-size:16px}
  p.sub{color:var(--muted);margin:0 0 16px;line-height:1.5}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:540px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;color:inherit;font:inherit;width:100%}
  button.card{cursor:pointer;transition:transform .12s,border-color .12s}
  button.card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .card .ico{font-size:22px;margin-bottom:8px}
  .card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:9px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .chip .prog{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--bg);color:var(--muted)}
  .chip .prog.full{background:var(--ok);color:#04150a}
  .btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;font-size:15px}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:#fca5a5;border:1px solid #5b2a2a}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font:inherit;font-size:15px}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
  input[type=checkbox]{width:auto}
  .checks{display:flex;flex-wrap:wrap;gap:8px}
  .checks label{display:flex;gap:6px;align-items:center;margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--text);cursor:pointer}
  .notice{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;line-height:1.55;font-size:14.5px}
  .notice.warn{border-color:#5b4b1f;background:#231e0a;color:#fde68a}
  .notice.err{border-color:#5b2a2a;background:#2a1213;color:#fca5a5}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:800;letter-spacing:.08em;background:var(--bg);border:1px dashed var(--accent);border-radius:10px;padding:8px 12px;display:inline-block}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .tblwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 8px}
  .muted{color:var(--muted)}
  .ok{color:#86efac}.bad{color:#fca5a5}
  .pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .pill.y{background:var(--yellow);color:#1c1500;border-color:var(--yellow)}
  .pill.g{background:var(--ok);color:#04150a;border-color:var(--ok)}
  .pill.r{background:#341618;color:#fca5a5;border-color:#5b2a2a}
  /* quiz */
  .qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .bar{flex:1;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .tag.hard{color:#fca5a5;border-color:#5b2a2a}.tag.mid{color:#fde68a;border-color:#5b4b1f}
  .tag.new{background:var(--yellow);color:#1c1500;border-color:var(--yellow)}
  .question{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--text);font:inherit;font-size:15px;line-height:1.4;cursor:pointer}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-weight:800;font-size:13px}
  .opt.correct{border-color:var(--ok);background:#12301f}.opt.correct .k{background:var(--ok);color:#04150a}
  .opt.wrong{border-color:var(--bad);background:#341618}.opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .verdict{margin:16px 0 0;padding:14px 16px;border-radius:14px;font-weight:800;font-size:16px}
  .verdict.ok{background:#12301f;color:#86efac}.verdict.bad{background:#341618;color:#fca5a5}
  .expl{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;line-height:1.55;font-size:14.5px}
  .expl h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .expl .blk{margin-bottom:14px}.expl .blk:last-child{margin-bottom:0}
  .expl ul{margin:6px 0 0;padding-left:18px}.expl li{margin-bottom:6px}
  .expl .ref{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;color:var(--yellow)}
  .qtimer{font-variant-numeric:tabular-nums;font-weight:800;font-size:13px;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
  .qtimer.low{color:var(--bad);border-color:var(--bad)}
  .score{font-size:44px;font-weight:800;letter-spacing:-.03em;margin:4px 0}
  .score.pass{color:var(--ok)}.score.fail{color:var(--bad)}
  .stat{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .stat .name{flex:1;font-weight:600;font-size:14px}.stat .name small{display:block;color:var(--muted);font-weight:500}
  .stat .bar{max-width:180px}.stat .pct{width:46px;text-align:right;font-weight:800}
  .review{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .review .q{font-weight:700;margin-bottom:6px;font-size:14.5px}
  .review .a{font-size:13.5px;color:var(--muted);line-height:1.5}
  details summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:13px;margin-top:8px}
  .qlist{display:flex;flex-direction:column;gap:8px}
  .qitem{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text);font:inherit;font-size:14.5px;line-height:1.45;cursor:pointer}
  .qitem:hover{border-color:var(--accent)}
  .qitem .st{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:1.5px solid var(--line);color:var(--muted)}
  .qitem .st.ok{background:var(--ok);border-color:var(--ok);color:#04150a}
  .qitem .st.bad{background:var(--bad);border-color:var(--bad);color:#fff}
  .qitem .meta{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-weight:600}
  .empty{color:var(--muted);text-align:center;padding:26px 10px}
  /* anti-copiere */
  body.locked #app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .wm{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden;opacity:.07}
  .wm div{position:absolute;left:-20%;width:140%;transform:rotate(-24deg);white-space:nowrap;font-weight:800;font-size:15px;color:#fff}
  .warnbar{background:#341618;border:1px solid var(--bad);color:#fca5a5;border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:700;margin-bottom:12px}
  .secure-note{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
  /* toast */
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;display:none;max-width:90vw}
  #toast.err{border-color:var(--bad);color:#fca5a5}
  .center{max-width:420px;margin:30px auto}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" id="brand">
      <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 11.5a6.5 6.5 0 0 0 12.9 1.2L21 11V7l-9.4 1.6A6.5 6.5 0 0 0 3 11.5Z" fill="currentColor"/><circle cx="9.5" cy="11.5" r="2" fill="#3ddc84"/></svg></div>
      <div><span id="appName">Fluier</span><small id="season">Legile Jocului</small></div>
    </div>
    <span class="spacer"></span>
    <div class="user" id="userBox"></div>
  </header>
  <nav class="tabs" id="tabs" style="display:none"></nav>
  <main id="app"><div class="empty">Se încarcă…</div></main>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
